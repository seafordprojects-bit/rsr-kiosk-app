<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RSR Tablets</title>
<style>
  :root{--bg:#f3f5f8;--card:#fff;--ink:#14212e;--mute:#66768a;--line:#dde3ea;--navy:#0e2a47;--ok:#12805c;--bad:#c62828;--warn:#b26a00;--btn:#eef2f7}
  @media (prefers-color-scheme:dark){:root{--bg:#0f151c;--card:#18212b;--ink:#e7edf4;--mute:#93a3b5;--line:#2a3643;--navy:#9cc3ec;--btn:#223040}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  header h1{margin:0;font-size:20px;color:var(--navy);flex:1}
  main{padding:16px;max-width:760px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .name{font-size:19px;font-weight:700;flex:1}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
  .stat{background:var(--bg);border-radius:10px;padding:8px 10px}
  .stat b{display:block;font-size:12px;color:var(--mute);font-weight:600}
  .btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  button{font:inherit;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:10px;min-height:46px;padding:8px 10px;cursor:pointer}
  button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  @media (prefers-color-scheme:dark){button.primary{color:#0f151c}}
  button.danger{color:var(--bad)}
  button:disabled{opacity:.5}
  /* press feedback (owner 2026-11-04): highlight on press, spinner until the tablet answers, then the result */
  button{transition:transform .08s,box-shadow .08s,background .2s}
  button:active{transform:scale(.96);filter:brightness(.88);box-shadow:0 0 0 3px var(--warn)}
  button.busy{background:#fff4d6;border-color:var(--warn);color:var(--warn);opacity:1;box-shadow:0 0 0 2px var(--warn)}
  button.okd{background:#e7f6ef;border-color:var(--ok);color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
  button.bad{background:#fdecea;border-color:var(--bad);color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
  @media (prefers-color-scheme:dark){button.busy{background:#3a2f12;color:#ffc04d}button.okd{background:#123326;color:#5fd6a4}button.bad{background:#3a1717;color:#ff8a80}}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;
        vertical-align:-2px;margin-right:6px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .sub{display:block;font-size:12px;font-weight:400}
  input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;width:100%;background:var(--card);color:var(--ink)}
  .mute{color:var(--mute);font-size:14px}
  .msg{padding:10px 12px;border-radius:10px;margin-bottom:12px;display:none}
  .msg.err{display:block;background:#fdecea;color:var(--bad)}
  .msg.ok{display:block;background:#e7f6ef;color:var(--ok)}
  ul.ev{margin:8px 0 0;padding-left:18px;color:var(--mute);font-size:14px}
  .err{color:var(--bad);word-break:break-word}
  #shot{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:9}
  #shot img{max-width:100%;max-height:80vh;border-radius:8px;background:#000}
  #shot p{color:#fff;margin:10px 0}
</style>
</head>
<body>
<header><h1>RSR Tablets</h1><span class="mute" id="stamp"></span></header>
<main>
  <div id="msg" class="msg"></div>

  <div class="card" id="login">
    <p style="margin-top:0">Enter the 6-digit <b>admin passcode</b> (same as the kiosk admin).</p>
    <input id="pc" type="password" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="Admin passcode">
    <div style="height:10px"></div>
    <button class="primary" id="go" style="width:100%">Open</button>
  </div>

  <div id="list"></div>
  <p class="mute" id="foot" style="display:none">Refreshes every 20 seconds (every 3 seconds while a command is waiting). A command reaches the tablet within about 1 minute.</p>
</main>
<div id="shot" onclick="closeShot()"><img id="shotImg" alt="Kiosk screenshot"><p id="shotCap"></p><button onclick="closeShot()">Close</button></div>
<script>
const SB = 'https://wpmcbjrisuyjvobvzaus.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndwbWNianJpc3V5anZvYnZ6YXVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjU3ODQsImV4cCI6MjA5MzQ0MTc4NH0.EGyUnXmVkUrsEteKICMRSOXURxYXPOaKUs8EYCpw6_0';
let passcode = '';          // kept in memory only, never saved
let timer = null;
// A command pressed here, before the server shows it as waiting: {device: {cmd, at}}. Shown busy at once.
const sending = {};
const NAMES = { reload: 'Reload page', hard_reload: 'Full reload', update: 'Update app', screen_on: 'Screen on',
  screenshot: 'Screenshot', screen_off: 'Screen off', open_settings: 'Open settings', restart: 'Restart tablet', schedule: 'Set schedule' };
const FAST_MS = 3000, SLOW_MS = 20000;
function schedule(fast) {
  clearTimeout(timer);
  timer = setTimeout(load, fast ? FAST_MS : SLOW_MS);
}

async function rpc(fn, body) {
  const r = await fetch(SB + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const t = await r.text();
  if (!r.ok) throw new Error(t || ('HTTP ' + r.status));
  return t ? JSON.parse(t) : null;
}

function show(text, kind) {
  const m = document.getElementById('msg');
  m.textContent = text || '';
  m.className = 'msg' + (text ? ' ' + (kind || 'ok') : '');
}

function ago(iso) {
  if (!iso) return '-';
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90) return s + ' s ago';
  if (s < 5400) return Math.round(s / 60) + ' min ago';
  if (s < 172800) return Math.round(s / 3600) + ' h ago';
  return Math.round(s / 86400) + ' days ago';
}
function hhmm(iso) {
  return iso ? new Date(iso).toLocaleString('en-PH', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let loadSeq = 0, drawnSeq = 0;
async function load() {
  const my = ++loadSeq, pc = passcode;
  try {
    const rows = await rpc('kiosk_app_list', { p_passcode: pc });
    if (my < drawnSeq) return;            // an older answer arriving late never paints over a newer one
    drawnSeq = my;
    if (rows && rows.error) {
      if (passcode === pc) logout(rows.error);   // only if nobody typed a new passcode meanwhile
      return;
    }
    document.getElementById('login').style.display = 'none';
    document.getElementById('foot').style.display = '';
    document.getElementById('stamp').textContent = 'Updated ' + new Date().toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' });
    render(rows || []);
    schedule(wantFast(rows || []));
  } catch (e) {
    if (my < drawnSeq) return;
    show('Cannot reach the server: ' + e.message, 'err');
    schedule(false);
  }
}

function logout(err) {
  passcode = ''; clearTimeout(timer);
  document.getElementById('login').style.display = '';
  document.getElementById('list').innerHTML = '';
  document.getElementById('foot').style.display = 'none';
  show(err === 'wrong passcode' ? 'Wrong passcode (after 10 wrong tries it locks for 15 minutes).' : err, 'err');
}

// ---- what a command button shows (owner 2026-11-04) -------------------------------------------
// busy:  from the press, while the server holds it ("waiting"), and while the tablet works on it ("started",
//        e.g. a restart waiting for a quiet moment, up to 6 min); then the result (green / red) for 30 s.
// Results are only shown for a command this page watched (pressed here or seen waiting), and the 30 s are
// counted on this phone's clock from the moment the result was first seen (phone and server clocks may differ).
const firstSeen = {}, watched = {};
const WORK_MS = 6 * 60000, RESULT_MS = 30000;
function since(key) { if (!(key in firstSeen)) firstSeen[key] = Date.now(); return Date.now() - firstSeen[key]; }
function cmdState(t, cmd) {
  const loc = sending[t.device_id];
  if (loc && loc.cmd === cmd) return { k: 'busy', sub: 'Sending...' };
  if (t.cmd !== cmd || !t.cmd_at) return null;
  const key = t.device_id + '|' + t.cmd_at;
  if (t.pending) { watched[key] = 1; return { k: 'busy', sub: 'Waiting for tablet...' }; }
  if (t.cmd_result === 'started') {
    watched[key] = 1;
    // server time check too, so an old "started" seen for the first time is not shown as busy forever
    if (since(key + '|started') < WORK_MS && Date.now() - new Date(t.cmd_done_at || t.cmd_at).getTime() < WORK_MS + 600000)
      return { k: 'busy', sub: 'Tablet is working on it...' };
    return since(key + '|started') < WORK_MS + RESULT_MS ? { k: 'bad', sub: 'No answer from the tablet' } : null;
  }
  if (!watched[key]) return null;
  if (!t.cmd_done_at) {   // the server let it expire: the tablet never picked it up
    return since(key + '|expired') < RESULT_MS ? { k: 'bad', sub: 'Not picked up (tablet offline?)' } : null;
  }
  if (since(key + '|done') >= RESULT_MS) return null;
  const good = /^(done|restarting|installing|up to date|schedule )/i.test(t.cmd_result || '');
  return good ? { k: 'okd', sub: 'Done' } : { k: 'bad', sub: 'Not done: ' + (t.cmd_result || '') };
}
function busyCmd(t) {
  for (const c of Object.keys(NAMES)) { const st = cmdState(t, c); if (st && st.k === 'busy') return c; }
  return null;
}
// every 3 s while a command is waiting on an ONLINE tablet (at most 6 min); otherwise every 20 s
function wantFast(rows) {
  if (document.hidden) return false;
  if (Object.keys(sending).length) return true;
  return rows.some(t => t.online && busyCmd(t) && Date.now() - new Date(t.cmd_at).getTime() < WORK_MS + 600000);
}

// One command button. The click is handled by one listener below (data-* values, never code in the HTML).
function cmdBtn(t, cmd, label, confirmText, cls, extraData) {
  const st = cmdState(t, cmd);
  let inner = esc(label);
  if (st && st.k === 'busy') inner = '<span class="spin"></span>' + esc(label) + '<span class="sub">' + esc(st.sub) + '</span>';
  else if (st) inner = (st.k === 'okd' ? '&#10003; ' : '&#10007; ') + esc(label) + '<span class="sub">' + esc(st.sub) + '</span>';
  return `<button data-dev="${esc(t.device_id)}" data-cmd="${esc(cmd)}" data-confirm="${esc(confirmText || '')}" ${extraData || ''}`
       + ` class="${cls || ''}${st ? ' ' + st.k : ''}"${st && st.k === 'busy' ? ' disabled' : ''}>${inner}</button>`;
}

function render(rows) {
  lastRows = rows;
  const L = document.getElementById('list');
  if (!rows.length) { L.innerHTML = '<div class="card">No tablet is running the RSR Kiosk app yet.</div>'; return; }
  L.innerHTML = rows.map(t => {
    // Roll-call phone (2026-11-12): same rule as Mode.java / kiosk_app_is_phone. Offline in the yard is normal.
    const phone = /^https:\/\/seafordprojects-bit\.github\.io\/[^?#]*\/monitoring\//i.test(t.page_url || '');
    const color = t.online ? 'var(--ok)' : (t.asleep || phone) ? 'var(--mute)' : 'var(--bad)';
    const batt = t.battery == null ? '-' : t.battery + '%' + (t.charging ? ' (charging)' : ' (NOT charging)');
    const battColor = (t.battery != null && t.battery <= 20 && !t.charging) || t.charging === false ? 'var(--warn)' : 'inherit';
    const last = t.cmd ? esc(t.cmd) + ': ' + (t.pending ? 'waiting for tablet...' : esc(t.cmd_result || '-')) + ' <span class="mute">' + hhmm(t.cmd_at) + '</span>' : '-';
    const sched = t.sched_on ? esc(t.sched_on) + ' to ' + esc(t.sched_off) : 'always on';
    const ev = (t.events || []).map(e => '<li>' + esc(e.event) + ' - ' + hhmm(e.at) + '</li>').join('');
    const id = esc(t.device_id);
    return `<div class="card">
      <div class="row"><span class="dot" style="background:${color}"></span><span class="name">${esc(t.name || t.device_id)}${phone ? ' <span class="mute">&#128241; roll-call phone</span>' : ''}</span>
        <span class="mute">${t.online ? 'Online' : phone ? 'Not on Wi-Fi (normal in the yard)' : t.asleep ? 'Asleep (screen schedule)' : 'OFFLINE'} - ${ago(t.last_seen)}</span></div>
      <div class="grid">
        <div class="stat"><b>Battery</b><span style="color:${battColor}">${batt}</span></div>
        <div class="stat"><b>Screen</b>${t.screen_on ? 'On' : 'Off'}</div>
        <div class="stat"><b>Kiosk page</b>${t.page_ok === false ? '<span style="color:var(--bad)">Not loading</span>' : 'OK'}</div>
        <div class="stat"><b>Lock</b>${t.device_owner ? 'Full lock' : '<span style="color:var(--warn)">Pinning only</span>'}${t.maintenance ? ' <span style="color:var(--warn)">(maintenance)</span>' : ''}</div>
        <div class="stat"><b>Screen schedule</b>${sched}</div>
        <div class="stat"><b>Wi-Fi</b>${t.wifi === false ? '<span style="color:var(--bad)">Not connected</span>'
            : t.wifi ? ('Signal ' + (t.wifi_signal == null ? '?' : esc(t.wifi_signal)) + '/4' + (t.internet === false ? ' <span style="color:var(--bad)">(no internet)</span>' : ''))
            : '-'}</div>
        <div class="stat"><b>Battery temp</b>${t.battery_temp == null ? '-' : '<span style="color:' + (t.battery_temp >= 45 ? 'var(--bad)' : t.battery_temp >= 40 ? 'var(--warn)' : 'inherit') + '">' + esc(t.battery_temp) + ' &deg;C</span>'}</div>
        <div class="stat"><b>Last outage</b>${t.last_outage ? esc(t.last_outage.minutes) + ' min, ' + esc(t.last_outage.reason) + '<br><span class="mute">' + hhmm(t.last_outage.reported_at) + '</span>' : 'none'}</div>
        <div class="stat"><b>Power</b>${t.power_windows ? 'Generator ' + esc(t.power_windows).replace(/,/g, ', ') : 'Grid (always on)'}</div>
        <div class="stat"><b>Battery use (measured)</b>${t.drain_on == null ? 'learning...' : esc(t.drain_on) + '%/h screen on' + (t.drain_off == null ? '' : ', ' + esc(t.drain_off) + '%/h off')}</div>
        <div class="stat"><b>App build</b>${esc(t.app_version)}</div>
        <div class="stat"><b>Kiosk page version</b>${t.page_version ? esc(t.page_version) : '<span class="mute">not reported yet</span>'}</div>
        <div class="stat"><b>Last page error</b>${t.page_error ? '<span class="err">' + esc(t.page_error) + '</span><br><span class="mute">' + hhmm(t.page_error_at) + ' (' + ago(t.page_error_at) + ')</span>' : 'none'}</div>
      </div>
      <div class="mute" style="margin-bottom:10px">Last command: ${last}</div>
      <div class="btns">
        ${cmdBtn(t, 'reload', 'Reload page', '', 'primary')}
        ${cmdBtn(t, 'hard_reload', 'Full reload', 'Full reload clears the old cached kiosk version (punches are kept). Continue?')}
        ${cmdBtn(t, 'update', 'Update app')}
        ${cmdBtn(t, 'screen_on', 'Screen on')}
        ${cmdBtn(t, 'screenshot', 'Screenshot')}
        ${t.shot_at ? `<button onclick="viewShot('${id}')">View screenshot<br><span class="mute">${hhmm(t.shot_at)}</span></button>` : ''}
        ${cmdBtn(t, 'screen_off', 'Screen off', 'Turn the screen off now?')}
        ${cmdBtn(t, 'schedule', 'Set schedule', '', '', 'data-on="' + esc(t.sched_on || '05:30') + '" data-off="' + esc(t.sched_off || '22:30') + '"')}
        <button onclick="askPower('${id}','${esc(t.power_windows || '')}')">Generator hours</button>
        ${cmdBtn(t, 'open_settings', 'Open settings', 'Open the settings screen on the tablet (no passcode needed for 10 minutes)?')}
        ${cmdBtn(t, 'restart', 'Restart tablet', 'Restart the tablet now? Workers cannot punch for about 1 minute.', 'danger')}
        <button class="danger" onclick="forgetTablet('${id}','${esc(t.name || t.device_id)}')">Forget tablet</button>
      </div>
      ${ev ? '<ul class="ev">' + ev + '</ul>' : ''}
    </div>`;
  }).join('');
}

let lastRows = [];
async function send(device, cmd, arg, confirmText) {
  if (sending[device]) return;   // one press at a time per tablet
  // The tablet holds ONE command: a new one replaces a waiting one. Ask before replacing.
  const t = lastRows.find(x => x.device_id === device);
  const b = t && busyCmd(t);
  if (b && !confirm('"' + (NAMES[b] || b) + '" is still ' + (t.pending ? 'waiting for' : 'running on') + ' the tablet.\nSend "'
                    + (NAMES[cmd] || cmd) + '" anyway?' + (t.pending ? ' (the waiting one is cancelled)' : ''))) return;
  if (confirmText && !confirm(confirmText)) return;
  sending[device] = { cmd, at: Date.now() };
  render(lastRows);   // busy at once, before the server answers
  let wrong = false;
  try {
    const r = await rpc('kiosk_app_command', { p_passcode: passcode, p_device: device, p_cmd: cmd, p_arg: arg || '' });
    if (r && r.error) { wrong = r.error === 'wrong passcode'; show(r.error, 'err'); return; }
    show('Sent "' + (NAMES[cmd] || cmd) + '". The button shows when the tablet is done.', 'ok');
  } catch (e) { show('Not sent: ' + e.message, 'err'); }
  finally {
    delete sending[device];
    if (wrong) logout('wrong passcode'); else load();   // never spend a second wrong try
  }
}

// Back to the page after looking elsewhere: refresh at once (refreshes are slow while the page is hidden).
document.addEventListener('visibilitychange', () => { if (!document.hidden && passcode) load(); });

// One listener for every command button (values come from data-*, so no text can turn into code).
document.getElementById('list').addEventListener('click', e => {
  const btn = e.target.closest('button[data-cmd]');
  if (!btn || btn.disabled) return;
  const d = btn.dataset;
  if (d.cmd === 'schedule') askSchedule(d.dev, d.on, d.off);
  else send(d.dev, d.cmd, '', d.confirm || '');
});

// The latest screenshot of the kiosk screen (camera hidden). Shown on top; the list keeps refreshing below.
async function viewShot(device) {
  try {
    const r = await rpc('kiosk_app_shot_get', { p_passcode: passcode, p_device: device });
    if (!r || r.error) { show((r && r.error) || 'No screenshot', 'err'); return; }
    if (!/^\/9j\/[A-Za-z0-9+/]+=*$/.test(r.jpeg || '')) { show('The screenshot is damaged. Take a new one.', 'err'); return; }
    document.getElementById('shotImg').src = 'data:image/jpeg;base64,' + r.jpeg;
    document.getElementById('shotCap').textContent = 'Taken ' + hhmm(r.taken_at) + ' (' + ago(r.taken_at) + ')';
    document.getElementById('shot').style.display = 'flex';
  } catch (e) { show('Cannot load the screenshot: ' + e.message, 'err'); }
}
function closeShot() {
  document.getElementById('shot').style.display = 'none';
  document.getElementById('shotImg').removeAttribute('src');
}

function forgetTablet(device, name) {
  if (!confirm('Forget "' + name + '"?\nOnly after a factory reset or reinstall of that tablet. It registers again by itself; its generator hours must then be set again.')) return;
  rpc('kiosk_app_forget', { p_passcode: passcode, p_device: device })
    .then(r => { if (r && r.error) show(r.error, 'err'); else { show('Tablet forgotten.', 'ok'); load(); } })
    .catch(e => show('Not done: ' + e.message, 'err'));
}

function askPower(device, cur) {
  const v = prompt('Generator hours for this tablet (Manila time), e.g.\n08:00-11:30,13:00-16:30,18:00-21:00+24:00\n(+24:00 = overtime may run until 24:00)\n\nCharging alerts then only apply while the generator should run; during breaks/night you are warned only if the battery may run out.\nLeave EMPTY for normal grid power.', cur || '08:00-11:30,13:00-16:30,18:00-21:00+24:00');
  if (v == null) return;
  rpc('kiosk_app_set_power', { p_passcode: passcode, p_device: device, p_windows: v.trim() })
    .then(r => { if (r && r.error) show(r.error, 'err'); else { show('Generator hours saved.', 'ok'); load(); } })
    .catch(e => show('Not saved: ' + e.message, 'err'));
}

function askSchedule(device, on, off) {
  const v = prompt('Screen ON-OFF time, e.g. 05:30-22:30\nType "off" to keep the screen always on.', on + '-' + off);
  if (v == null) return;
  send(device, 'schedule', v.trim());
}

document.getElementById('go').onclick = () => {
  passcode = document.getElementById('pc').value.trim();
  document.getElementById('pc').value = '';
  if (!passcode) return;
  show('');
  clearTimeout(timer);
  load();
};
document.getElementById('pc').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('go').click(); });
</script>
</body>
</html>
