name: Check (compile + tests, no release)

# Branches other than main: compile the app and run the plain-Java tests BEFORE anything goes to main.
# Never signs, never publishes a release, so no tablet or phone can install from here.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Plain-Java tests
        run: |
          set -e
          S=app/src/main/java/ph/rsr/kiosk
          run() { rm -rf out && mkdir out && javac -d out "$@" && java -cp out ph.rsr.kiosk.$(basename "${@: -1}" .java); }
          run $S/Mode.java test/ModeTest.java
          run $S/Awake.java test/AwakeTest.java
          run $S/PasscodeText.java test/PasscodeTextTest.java
          run $S/TelcoText.java test/TelcoTextTest.java
          run $S/ModemXml.java test/ModemXmlTest.java
          run $S/SleepRules.java test/SleepRulesTest.java
      - name: Build the app (debug, not published)
        run: gradle :app:assembleDebug --no-daemon --stacktrace   # full debug build (manifest + dex), debug key only, never published
